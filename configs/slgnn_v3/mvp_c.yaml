# Perfil compliant normal `v3-C`.
#
# Canales activos: V (potencial repulsivo monótono) y Psi (disipación convexa
# normal). Rama impulsiva desactivada: la protección impulsiva queda en `false`
# para que los experimentos de identificación de v3-C sean limpios (§9.1).
#
# La auditoría temporal (docs/slgnn_v3/DATA_AUDIT.md) respalda este perfil para los
# datasets de caja: la duración de contacto medida es de 4 a 16 snapshots.

model:
  eps: 1.0e-12
  memory_enabled: false
  closure_enabled: false

  graph:
    pp_gap_on: 0.02
    pp_gap_off: 0.35
    pw_gap_on: 0.02
    pw_gap_off: 0.35
    skin: 0.15
    ccd: true
    ccd_margin: 0.0

  encoder:
    hidden: 48
    n_material_types: 4
    material_dim: 8
    n_message_steps: 2
    activation: silu

  potential:
    hidden: 48
    f0: 1.0
    exponent: 1.0          # ley lineal aprendida; 1.5 = prior Hertziano
    quad_nodes: 8
    eps_unilateral: 0.02

  dissipation:
    hidden: 48
    d0: 1.0
    tangential: false      # fase 9
    rotational: false      # fase 9

  impact:
    hidden: 48
    e_max: 1.0
    kappa0: 1.0e-3
    friction: false        # fase 9

  solver:
    max_iters: 30
    eval_max_iters: 200
    tol: 1.0e-9
    beta: 0.2
    kappa_floor: 1.0e-9
    power_iters: 12

  router:
    profile: v3-C
    g_tol: 0.0
    g_ccd: 0.0
    g_on: 0.0
    g_off: 0.05
    n_grace: 1
    impulsive_protection: false
