# Nivel 2: una esfera contra pared plana.
#
# En la etapa normal se prioriza el caso de 90 grados (impacto normal puro).
# Los ángulos oblicuos se cargan solo para *diagnosticar* la física pendiente:
# el error tangencial que produzcan NO cuenta como fallo del canal normal,
# porque la fricción y el spin llegan en la fase 9 (§16.4).

name: one_sphere_wall

data:
  dataset: one_sphere_wall
  train_cases: ["90"]
  val_case: "60"
  test_cases: ["45", "30", "10"]

sampler:
  quotas:
    free: 0.20
    pp: 0.0
    pw: 0.40
    mixed: 0.0
    contact_birth: 0.35
    high_compression: 0.05

train:
  updates: 400
  batch_size: 4
  lr: 3.0e-3
  grad_clip: 1.0
  eval_every: 50
  log_every: 50
  lambda_delta_p: 1.0
  lambda_delta_L: 0.0

rollout_horizons: [1, 5, 10, 25]
